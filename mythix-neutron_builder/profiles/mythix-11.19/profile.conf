# ── mythix-11.19 ─────────────────────────────────────────────────────────────
# Mythix Wine 11.19 — Wayland-first.
#   Valve bleeding-edge (Wine 11.0 lineage + Valve backports)
#   + GE-Proton's own patch stack (staging v11.0 with GE's exclusions, game fixes,
#     and GE's Wayland work: wine-wayland, wineland child rendering, em-fixups)
#   + curated TkG 11.19 layer (patches/0001-mythix-tkg-11.19.patch)
#   + build compat shims for the Ubuntu 24.04 container (patches/0002-…)
#   + Mythix DualShock 4 support (patch group mythix-ds4)
#   + static FFmpeg in winedmo (GE removed winegstreamer; media = winedmo+FFmpeg)
#
# Sourced by neutron-builder.sh (--profile mythix-11.19) and mythix-ge-pipeline.sh.
# Bumping a pin means re-curating patches/ for the new tree — see ../README.md.

PROFILE_DESC="Mythix Wine 11.19 — Valve BE + GE (Wayland) + TkG 11.19 + DS4 · classic multilib"
PROFILE_PIPELINE="ge"               # ge = GE protonprep pipeline (mythix-ge-pipeline.sh)
PROFILE_BUILD_MODE="classic"        # classic multilib (wine64 + 32-bit tree), not WoW64
PROFILE_PACKAGE_NAME="Mythix-Neutron-11.19-1"
PROFILE_VERSION_LABEL="11.19"
PROFILE_WAYLAND="1"                 # neutron launcher defaults to winewayland on Wayland
PROFILE_PATCH_GROUPS="mythix-ds4"   # neutron patch groups applied after the pipeline
PROFILE_FFMPEG="static"             # build GE's pinned FFmpeg, link it into winedmo.so

# ── Pinned inputs ────────────────────────────────────────────────────────────
PIN_GE_REPO="https://github.com/GloriousEggroll/proton-ge-custom.git"
PIN_GE_COMMIT="a3f58c5af0620810b123bfd2e72dd16ad8f61886"        # 2026-10-06 "patches: add fix for #773"

PIN_WINE_REPO="https://github.com/ValveSoftware/wine.git"
PIN_WINE_COMMIT="1c78596625336a73dbfc035dbbcf0dbdd95b06eb"      # bleeding-edge 2026-09-22 = GE's wine pin

PIN_STAGING_REPO="https://github.com/wine-staging/wine-staging.git"
PIN_STAGING_COMMIT="6cc805ea57132eeaf44764e9213823c9b8d0d300"   # v11.0 = GE's staging pin

# FFmpeg defaults to GE's submodule pin (recorded in the source lock):
#   9047fa1b084f76b1b4d065af2d743df1b40dfb56 = FFmpeg 8.1 at GE a3f58c5
# PIN_FFMPEG_COMMIT=""                # set to override GE's pin

# Provenance of patches/0001 (informational — the layer is pre-curated, not extracted at build time)
TKG_SOURCE="Kron4ek/wine-tkg 11.19 b471df7dc4f2f6d9e6c3a9ea87e10a03da92e25a minus wine-11.19 + wine-staging v11.19 766285c4"
