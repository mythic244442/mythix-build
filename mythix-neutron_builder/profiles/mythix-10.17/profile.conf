# ── mythix-10.17 ─────────────────────────────────────────────────────────────
# Mythix Wine 10.17 — FROZEN. Recipe of the installed Mythix-Neutron-10.17-1
# (esync/fsync, classic multilib with wine64).
#
#   Valve proton_10.0  +  TkG 10.17 (Kron4ek fsync branch)  +  staging v10.20  +  GE
#   through the legacy mythix-wine layer pipeline in neutron-builder.sh,
#   with GE's Steam client bridge built in-tree (PROFILE_STEAM_BRIDGE=ge)
#   + Mythix DualShock 4 (patch group mythix-ds4-10): winebus hidraw haptics/LED
#     + xinput Sony direct path and MYTHIX_DS4_GLYPHS=1 native PlayStation mode
#
# Every upstream input is pinned so 10.17 can always be rebuilt. Keep the Wine
# recipe as it is; Mythix's own additions (the Steam bridge, DS4) bump the
# package suffix. Make a new profile for anything else new.
#
# Provenance (2026-10-06):
#   * base/TkG/staging confirmed by /stuff/compatibilitytools.d/mythix-neutron-10.17-build.log
#   * the installed package's ntdll.so reports "wine-10.17.r0.gf686957b (Mythix Wine)", i.e. the
#     second build of 2026-08-13 (after the rebrand step) — its log was not saved, so the GE commit
#     is the newest one before that build (20087755); the first build used f8e25ab
#   * acceptance test: a rebuild must match the installed package's file list/sizes and run the
#     same games (the original -1 stays untouched; rebuilds are named -2)

PROFILE_DESC="Mythix Wine 10.17 (frozen) — Valve proton_10.0 + TkG 10.17 esync/fsync + staging v10.20 + GE"
PROFILE_PIPELINE="legacy"           # legacy = the original mythix-wine layer pipeline
PROFILE_BUILD_MODE="classic"
PROFILE_PACKAGE_NAME="Mythix-Neutron-10.17-3"
PROFILE_VERSION_LABEL="10.17"
PROFILE_WAYLAND="0"
PROFILE_PATCH_GROUPS="mythix-ds4-10"   # neutron patch groups applied after the pipeline
PROFILE_STEAM_BRIDGE="ge"           # build GE's lsteamclient + steam.exe with this Wine
# -2 Steam client bridge built in-tree · -3 Mythix DualShock 4 (mythix-ds4-10)
# -1 shipped the packager's fallback: steam.exe/steamclient from a downloaded
#    Kron4ek Proton 10.0-4. That binary is ABI-matched to Proton 10.0's Wine,
#    not ours — Steam games crashed in the steamclient trampolines. Building
#    the bridge in-tree matches it to this Wine and removes the download.
#    Its sources are pinned separately (PIN_STEAM_BRIDGE_COMMIT below): the
#    GE patch pin 20087755 carries a Wine 11-era lsteamclient that calls
#    ntdll_get_dos_file_name/ntdll_get_unix_file_name, which proton_10.0
#    doesn't have (Valve added them for 11.0).
STEAM_BRIDGE_SKIP_PATCH_DIRS="patches/discordrpc/helpers"   # no Discord RPC bridge here either
PROFILE_STEAM_RUNTIME="sniper"      # SLR 3.0 — 10.x Wine still targets Sniper

LEGACY_WINE_BASE="proton_10.0"
PIN_WINE_COMMIT="b8fdff8e1f855b5276ec4ddca0f31b2792554322"      # proton_10.0 HEAD since 2026-01-19
PIN_TKG_COMMIT="e022fa13cf01228d0ef926545a24f2d53e463159"       # Kron4ek fsync branch "Add 10.17 with esync/fsync"
PIN_STAGING_REF="v10.20"                                        # last 10.x staging release
PIN_GE_COMMIT="20087755ce2df45840958eb82fe9f3947361ecfb"        # GE master as of the 2026-08-13 rebrand build
# lsteamclient + steam.exe: GE-Proton10-34 (2026-03-22), the last GE release
# before GE moved lsteamclient to Wine 11 (706700ce, 2026-05-12). Built on
# proton_10.0 Wine; uses wine_unix_to_nt_file_name/wine_nt_to_unix_file_name.
PIN_STEAM_BRIDGE_COMMIT="721dd76896b434fe3c1328ea533e0b25b4af04d5"
